patch:
  style:
    # 新版鼠须管（1.0+）横排核心参数
    candidate_list_layout: linear
    # 旧版鼠须管兼容参数
    horizontal: true
    # 候选词与编码合并在同一行（若想编码在上、候选词在下，改为 false）
    inline_preedit: true
    candidate_format: "%c. %@"
    corner_radius: 8
    hilited_corner_radius: 6
    border_height: 4
    border_width: 6
    line_spacing: 6
    spacing: 10
    font_face: "PingFang SC"
    font_point: 16
    label_font_face: "PingFang SC"
    label_font_point: 14
    color_scheme: sogou_light
    color_scheme_dark: sogou_dark

  preset_color_schemes:
    sogou_light:
      name: "仿搜狗浅色"
      author: "Custom"
      back_color: 0xFFFFFF
      border_color: 0xE5E5E5
      text_color: 0x333333
      hilited_text_color: 0xFF6600
      hilited_back_color: 0xFFFFFF
      hilited_candidate_text_color: 0xFFFFFF
      hilited_candidate_back_color: 0xFF6A00
      hilited_candidate_label_color: 0xFFFFFF
      candidate_text_color: 0x222222
      label_color: 0x888888
      comment_text_color: 0x999999
    sogou_dark:
      name: "仿搜狗深色"
      author: "Custom"
      back_color: 0x252526
      border_color: 0x3C3C3C
      text_color: 0xCCCCCC
      hilited_text_color: 0xFF8533
      hilited_back_color: 0x252526
      hilited_candidate_text_color: 0xFFFFFF
      hilited_candidate_back_color: 0xFF6A00
      hilited_candidate_label_color: 0xFFFFFF
      candidate_text_color: 0xE0E0E0
      label_color: 0x8E8E93
      comment_text_color: 0x7A7A7A
